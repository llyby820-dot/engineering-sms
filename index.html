<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منظومة التسجيل والدراسة - كلية الهندسة</title>
    <style>
        :root {
            --primary: #007bff;
            --bg-dark: #1e293b;
            --border: #ced4da;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: var(--bg-dark); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; }
        .login-card { background: white; width: 100%; max-width: 400px; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .login-header { background: var(--primary); color: white; padding: 20px; text-align: center; font-size: 1.1rem; font-weight: bold; }
        .login-body { padding: 25px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 0.85rem; color: #475569; }
        input, select { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 4px; font-size: 0.95rem; outline: none; }
        .btn { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 4px; font-size: 1rem; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn:hover { background: #0056b3; }
    </style>
</head>
<body>

<div class="login-card">
    <div class="login-header">
        🏛️ منظومة التسجيل والدراسة<br>
        <span style="font-size:0.85rem; font-weight:normal;">كلية الهندسة</span>
    </div>
    <div class="login-body">
        <form id="loginForm">
            <div class="form-group">
                <label>نوع الحساب:</label>
                <select id="userRole">
                    <option value="student">طالب (برقم القيد)</option>
                    <option value="admin">مسجل الكلية / أدمن</option>
                </select>
            </div>
            <div class="form-group">
                <label>اسم المستخدم / رقم القيد:</label>
                <input type="text" id="username" placeholder="أدخل رقم القيد أو اسم المستخدم" required>
            </div>
            <div class="form-group">
                <label>كلمة المرور:</label>
                <input type="password" id="password" placeholder="أدخل كلمة المرور" required>
            </div>
            <button type="submit" class="btn">تسجيل الدخول</button>
        </form>
    </div>
</div>

<!-- ربط مكتبات Firebase ومفاتيحك الخاصة -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBJFa0Am86uIOo1zWGRjf1wZnHrI_UUN50",
        authDomain: "engineering-sms.firebaseapp.com",
        projectId: "engineering-sms",
        storageBucket: "engineering-sms.firebasestorage.app",
        messagingSenderId: "1054730399462",
        appId: "1:1054730399462:web:4fef9d4524bbaddd51d527",
        measurementId: "G-8ZBFTXX7PR"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const role = document.getElementById('userRole').value;
        const userKey = document.getElementById('username').value.trim();
        const passKey = document.getElementById('password').value.trim();

        try {
            if (role === 'student') {
                // التحقق من قاعدة البيانات في جدول الطلاب
                const studentDoc = await getDoc(doc(db, "students", userKey));
                
                if (studentDoc.exists()) {
                    const stData = studentDoc.data();
                    if (stData.password === passKey) {
                        sessionStorage.setItem('active_student_id', userKey);
                        window.location.href = 'student.html';
                    } else {
                        alert('كلمة المرور غير صحيحة!');
                    }
                } else {
                    // دخول افتراضي أولي إذا لم يسجل كلمة مرور خاصة به بعد (افتراضياً كلمة السر هي رقم القيد)
                    if (passKey === userKey) {
                        sessionStorage.setItem('active_student_id', userKey);
                        window.location.href = 'student.html';
                    } else {
                        alert('رقم القيد غير مسجل أو كلمة المرور خطأ.');
                    }
                }
            } else if (role === 'admin') {
                if (userKey === 'admin' && passKey === 'admin123') {
                    sessionStorage.setItem('active_admin', 'true');
                    window.location.href = 'admin.html';
                } else {
                    alert('بيانات الأدمن غير صحيحة! (اسم المستخدم: admin | كلمة المرور: admin123)');
                }
            }
        } catch (error) {
            console.error("Error during login: ", error);
            alert("حدث خطأ في الاتصال بقاعدة البيانات السحابية!");
        }
    });
</script>

</body>
</html>
